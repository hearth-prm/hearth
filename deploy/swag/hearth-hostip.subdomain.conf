# Hearth — SWAG reverse proxy configuration (host-IP upstream)
#
# The straightforward option, and the one to prefer if you already manage your
# reverse proxies in SWAG: it proxies to the port Hearth publishes on the Docker
# host, so it does not care what network anything is attached to and needs no
# changes to your SWAG container.
#
# Install:
#   cp deploy/swag/hearth-hostip.subdomain.conf \
#      /mnt/user/appdata/swag/nginx/proxy-confs/hearth.subdomain.conf
#   # replace UNRAID_HOST_IP below with your server's LAN IP
#   docker restart swag
#
# Requires in Hearth's .env:
#   AUTH_URL=https://hearth.example.com   the origin you browse to, and the
#                                         redirect URI registered with Google
#   AUTH_TRUST_HOST=true                  so Auth.js honours X-Forwarded-Proto
#   APP_BIND unset (or 0.0.0.0)           the port must be reachable from SWAG,
#                                         so it cannot be bound to loopback
#
# Trade-off: port 3000 stays open on your LAN over plain http. Anyone who hits it
# directly gets the sign-in page but cannot establish a session — an https
# AUTH_URL makes Auth.js issue __Secure- cookies, which browsers refuse to send
# over http. If you would rather close it entirely, use the shared-network
# variant (hearth.subdomain.conf) instead.

server {
    listen 80;
    listen [::]:80;
    server_name hearth.*;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # SWAG convention: matches hearth.<your-domain>, whatever domain that is.
    server_name hearth.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        # Prefer SWAG's own proxy.conf over hand-written headers. It sets Host,
        # X-Real-IP and the X-Forwarded-* family, and — importantly — maps
        # Connection through $connection_upgrade so it is only "upgrade" on an
        # actual websocket handshake. Hardcoding Connection "upgrade" sends it on
        # every ordinary request too, which is not what you want.
        include /config/nginx/proxy.conf;

        # Replace with your Docker host's LAN IP.
        proxy_pass http://UNRAID_HOST_IP:3000;

        # Next.js streams server-rendered payloads; buffering would hold each
        # response until it was complete, turning progressive rendering into a
        # stall.
        proxy_buffering off;
    }
}
