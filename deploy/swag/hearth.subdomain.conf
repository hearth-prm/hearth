# Hearth — SWAG reverse proxy configuration
#
# Copy to SWAG's proxy-confs directory and restart SWAG:
#   cp deploy/swag/hearth.subdomain.conf \
#      /mnt/user/appdata/swag/nginx/proxy-confs/hearth.subdomain.conf
#   docker restart swag
#
# Requires:
#   * SWAG and hearth-app on a shared Docker network (see docker-compose.proxy.yml),
#     because Docker's embedded DNS only resolves container names there.
#   * A certificate covering this subdomain — already true with a wildcard cert;
#     otherwise add "hearth" to SWAG's SUBDOMAINS and restart to issue one.
#   * AUTH_URL in Hearth's .env set to the same https origin, e.g.
#     https://hearth.example.com — Auth.js builds its OAuth callback from this,
#     and it must match the redirect URI registered with Google exactly.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # SWAG convention: matches hearth.<your-domain>, whatever domain that is.
    server_name hearth.*;

    include /config/nginx/ssl.conf;

    client_max_body_size 0;

    location / {
        # proxy.conf sets Host and X-Forwarded-Proto, which is how Auth.js knows
        # the request arrived over https. AUTH_TRUST_HOST=true must be set for
        # those headers to be honoured.
        include /config/nginx/proxy.conf;
        # Docker's DNS resolver, so the upstream is looked up at request time
        # rather than pinned at nginx start — the container's IP changes on every
        # recreate, and without this nginx caches the stale one until restarted.
        include /config/nginx/resolver.conf;

        set $upstream_app hearth-app;
        set $upstream_port 3000;
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Next.js streams server-rendered payloads. nginx buffering would hold
        # them until complete, turning progressive rendering into a stall.
        proxy_buffering off;
    }
}
