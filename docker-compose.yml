# Pin the project name. Without this, Compose derives it from the directory the
# file sits in — which for a checkout at .../hearth/app means the project is
# called "app", containers are named "app-1", and it collides with any other
# stack that also happens to live in a directory named "app".
name: hearth

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-hearth}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-hearth}"
    volumes:
      # Defaults to the named volume below. Set PGDATA_PATH to an absolute path
      # to bind-mount instead — required on Unraid and similar appliances, where
      # the Docker volume store lives on a fixed-size docker.img that is erased
      # by a "delete docker image file" reset. Compose treats a source starting
      # with / or ./ as a bind mount and anything else as a named volume.
      - "${PGDATA_PATH:-pgdata}:/var/lib/postgresql/data"
    healthcheck:
      # -d/-U are required, otherwise pg_isready checks the wrong database and
      # reports healthy while the app's database is still being created.
      test:
        ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hearth} -d ${POSTGRES_DB:-hearth}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    # Not published to the host by default: nothing outside the compose network
    # needs it. Uncomment to connect a local client.
    # ports:
    #   - "5432:5432"

  app:
    build:
      context: .
      # Populated by `npm run docker:up`, which exports them from git and
      # package.json. Building with plain `docker compose up --build` still
      # works — the image just reports an unknown commit.
      args:
        APP_VERSION: "${APP_VERSION:-}"
        GIT_SHA: "${GIT_SHA:-unknown}"
        BUILD_TIME: "${BUILD_TIME:-}"
    image: "hearth:${APP_VERSION:-dev}"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Quoted because a ${VAR:?message} whose message contains ": " would
      # otherwise be parsed by YAML as a nested mapping.
      DATABASE_URL: "${DATABASE_URL:?set DATABASE_URL in .env}"
      AUTH_SECRET: "${AUTH_SECRET:?missing - generate one with openssl rand -base64 32}"
      AUTH_URL: "${AUTH_URL:-http://localhost:3000}"
      AUTH_TRUST_HOST: "${AUTH_TRUST_HOST:-true}"
      AUTH_GOOGLE_ID: "${AUTH_GOOGLE_ID:?set AUTH_GOOGLE_ID in .env}"
      AUTH_GOOGLE_SECRET: "${AUTH_GOOGLE_SECRET:?set AUTH_GOOGLE_SECRET in .env}"
      NODE_ENV: production
    ports:
      # APP_BIND defaults to every interface, which is what you want for direct
      # access. Behind a reverse proxy on a shared Docker network, set it to
      # 127.0.0.1 so the only route in is through the proxy — and therefore
      # through TLS. Auth.js issues __Secure- cookies for an https AUTH_URL, so
      # plain-http access would not be able to sign in anyway.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

volumes:
  pgdata:
